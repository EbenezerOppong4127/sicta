<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SICTA — Contrôle technique automobile, Côte d’Ivoire</title>
  <meta name="description" content="Réservez votre visite technique SICTA en 1 clic, payez par Mobile Money et recevez votre Pass QR. Espace flotte pour les entreprises.">
  <meta name="theme-color" content="#0b2545">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SICTA">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <div id="offline" class="offline" role="status" hidden>Hors ligne — vos Pass restent disponibles.</div>

  <header class="topbar" id="topbar">
    <div class="topbar__in">
      <button class="icon-btn" id="back" aria-label="Retour" hidden>
        <svg class="i" aria-hidden="true"><use href="icons/sprite.svg#arrow_back"/></svg>
      </button>
      <a class="brand" href="#/" aria-label="SICTA — accueil">
        <img src="icons/logo.svg" alt="" width="32" height="32">
        <span class="brand__t"><b>SICTA</b><small>Côte d’Ivoire</small></span>
      </a>
      <div class="topbar__title" id="page-title" aria-hidden="true"></div>
      <nav class="topnav" aria-label="Navigation principale" id="topnav"></nav>
      <div class="topbar__end">
        <a class="btn btn--cta btn--sm topbar__cta" href="#/reserver">Prendre RDV en ligne</a>
        <a class="icon-btn icon-btn--sos" href="tel:1301" aria-label="Urgence 1301">
          <svg class="i" aria-hidden="true"><use href="icons/sprite.svg#support_agent"/></svg>
        </a>
        <a class="avatar avatar--btn" href="#/compte" id="avatar" aria-label="Mon profil">K</a>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>
  <main id="main" tabindex="-1"></main>
  <footer class="footer" id="footer" hidden></footer>
  <div id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px">SICTA nécessite JavaScript pour fonctionner.</p></noscript>
  <script src="js/vendor/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
